#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose Preview resolves resources for every variant; keep unit-test components for
# both debug and release (AGP 9 only creates the tested build type by default).
android.onlyEnableUnitTestForTheTestedBuildType=false
